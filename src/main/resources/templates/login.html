<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container">
    <div class="lang-switcher">
        <a th:href="@{''(lang='en')}" class="lang-option" th:classappend="${#locale.language == 'en'} ? 'lang-option--active'">EN</a>
        <a th:href="@{''(lang='de')}" class="lang-option" th:classappend="${#locale.language == 'de'} ? 'lang-option--active'">DE</a>
        <a th:href="@{''(lang='fr')}" class="lang-option" th:classappend="${#locale.language == 'fr'} ? 'lang-option--active'">FR</a>
        <a th:href="@{''(lang='uk')}" class="lang-option" th:classappend="${#locale.language == 'uk'} ? 'lang-option--active'">UKR</a>
        <a th:href="@{''(lang='ru')}" class="lang-option" th:classappend="${#locale.language == 'ru'} ? 'lang-option--active'">RU</a>
    </div>

    <h2 th:text="#{login.heading}">Login</h2>

    <div th:if="${param.error}" class="error" th:text="#{login.error}">
        Invalid email or password
    </div>

    <form th:action="@{/login}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label for="username" th:text="#{login.email}">Email</label>
            <input id="username" type="email" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label th:text="#{login.password}">Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" th:text="#{login.submit}">Sign In</button>
    </form>

    <p style="text-align: center; font-size: 13px; margin-top: 20px;">
        <a href="/forgot-password" class="forgot-link" th:text="#{login.forgotPassword}">Forgot password?</a>
    </p>
    <div class="legal-footer">
        <a th:href="@{/impressum}" th:text="#{login.impressum}">Impressum</a>
        <span class="separator">&middot;</span>
        <a th:href="@{/privacy}" th:text="#{login.privacy}">Privacy Policy</a>
    </div>
</div>

</body>
</html>
