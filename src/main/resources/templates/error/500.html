<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{common.error500.pageTitle}">Error 500</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body th:classappend="${isAdmin} ? 'theme-admin' : 'theme-client'">

<div class="error-page">
    <div class="error-glow"></div>

    <div class="error-card">
        <p class="error-code" th:text="#{common.error500.code}">500</p>
        <h1 class="error-title" th:text="#{common.error500.title}">Something went wrong on our end</h1>
        <p class="error-message" th:text="${errorMessage}">An unexpected error occurred. Please try again later.</p>

        <div class="error-actions">
            <button type="button" class="btn-back" onclick="history.back()" th:text="#{common.error500.back}">Go back</button>
        </div>
    </div>
</div>

</body>
</html>
