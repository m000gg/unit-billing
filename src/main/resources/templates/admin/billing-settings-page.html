<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.billing.settings.pageTitle}">Billing Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin/billing-settings-page.css}">
</head>
<body>

<div th:replace="~{admin/sidebar :: aside}"></div>

<div class="main-content">

    <div class="page-header">
        <p class="eyebrow" th:text="#{admin.billing.settings.eyebrow}">System Configuration</p>
        <h1 th:text="#{admin.billing.settings.title}">Billing Settings</h1>
        <p class="page-subtitle" th:text="#{admin.billing.settings.subtitle}">
            The base currency configured during initial setup.
        </p>
    </div>

    <div class="currency-hero">
        <div>
            <p class="currency-hero__label" th:text="#{admin.billing.settings.baseCurrency.label}">Base Currency</p>
            <h2 class="currency-hero__value" th:text="${baseCurrency}">EUR</h2>
            <p class="currency-hero__hint" th:text="#{admin.billing.settings.baseCurrency.hint}">
                Used for system-wide reporting and analytics. Individual users can still hold balances in their own
                currency.
            </p>
        </div>
        <div class="currency-hero__icon" th:text="${baseCurrency}">UAH</div>
    </div>

</div>

</body>
</html>
