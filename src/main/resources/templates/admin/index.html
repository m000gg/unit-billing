<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Billing Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/index.css}">
</head>
<body>

<div th:replace="~{admin/sidebar :: aside}"></div>

<div class="main-content">

    <header class="page-header">
        <p class="eyebrow">Control Panel</p>
        <h1>Welcome back</h1>
        <p class="page-subtitle">Quick access to admin actions</p>
    </header>

    <section class="task-panel">
        <div class="grid-container">
            <a href="/admin/users/registration" class="card">
                <div class="card-glow"></div>
                <div class="icon">👤</div>
                <p>User Registration</p>
                <span class="card-arrow">→</span>
            </a>

            <a href="/admin/users/" class="card">
                <div class="card-glow"></div>
                <div class="icon">🌎</div>
                <p>Users List</p>
                <span class="card-arrow">→</span>
            </a>
        </div>
    </section>

</div>

</body>
</html>
