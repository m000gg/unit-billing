<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user-registration.css}">
</head>
<body>

<div th:replace="~{admin/sidebar :: aside}"></div>

<div class="main-content">

    <div class="page-header">
        <p class="eyebrow">User Management</p>
        <h1>Add New User</h1>
        <p class="page-subtitle">Register a new user account and assign a password</p>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <div class="alert-title">
            <span class="alert-icon">✓</span>
            <h3>User registered successfully</h3>
        </div>
        <p>Copy the password below — it will not be shown again.</p>
        <div class="password-box">
            <span th:text="${generatedPassword}"></span>
            <button type="button" class="copy-btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent.trim())">Copy</button>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <div class="alert-title">
            <span class="alert-icon">!</span>
            <h3>Registration failed</h3>
        </div>
        <p>No available internet points found in your area or capacity is full.</p>
    </div>

    <div class="reg-form-container">
        <form method="POST" th:action="@{/registration}" th:object="${registerDto}">

            <div class="form-section">
                <h4 class="section-title">Personal details</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>First name</label>
                        <input th:field="*{firstName}" type="text" required>
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input th:field="*{lastName}" type="text" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email address</label>
                        <input th:field="*{email}" type="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone number</label>
                        <input th:field="*{phone}" type="text" placeholder="+XXXXXXXXXXXX" maxlength="13" required>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4 class="section-title">Address</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label>Country</label>
                        <input th:field="*{country}" type="text" required>
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input th:field="*{city}" type="text" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Region</label>
                        <input th:field="*{region}" type="text">
                    </div>
                    <div class="form-group">
                        <label>Street</label>
                        <input th:field="*{street}" type="text" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>House number</label>
                        <input th:field="*{houseNumber}" type="text" required>
                    </div>
                    <div class="form-group">
                        <label>Apartment</label>
                        <input th:field="*{apartment}" type="text">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Postal code</label>
                        <input th:field="*{postalCode}" type="text" required>
                    </div>
                    <div class="form-group"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Register User</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
