<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.userRegistration.title}">User Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user-registration.css}">
</head>
<body>

<div th:replace="~{admin/sidebar :: aside}"></div>

<div class="main-content">

    <div class="page-header">
        <p class="eyebrow" th:text="#{admin.userRegistration.management}">User Management</p>
        <h1 th:text="#{admin.userRegistration.heading}">Add New User</h1>
        <p class="page-subtitle" th:text="#{admin.userRegistration.subtitle}">Register a new user account and assign a password</p>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <div class="alert-title">
            <span class="alert-icon">✓</span>
            <h3 th:text="#{admin.userRegistration.success.title}">User registered successfully</h3>
        </div>
        <p th:text="#{admin.userRegistration.success.desc}">Copy the password below — it will not be shown again.</p>
        <div class="password-box">
            <span th:text="${generatedPassword}"></span>
            <button type="button" class="copy-btn" onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent.trim())" th:text="#{admin.userRegistration.copy}">Copy</button>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <div class="alert-title">
            <span class="alert-icon">!</span>
            <h3 th:text="#{admin.userRegistration.error.title}">Registration failed</h3>
        </div>
        <p th:text="${error}"></p>
    </div>

    <div class="reg-form-container">
        <form method="POST" th:action="@{/admin/users/registration}" th:object="${registerDto}" novalidate>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-section">
                <h4 class="section-title" th:text="#{admin.userRegistration.section.personal}">Personal details</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.firstName}">First name</label>
                        <input th:field="*{firstName}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.lastName}">Last name</label>
                        <input th:field="*{lastName}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.email}">Email address</label>
                        <input th:field="*{email}" type="email" required>
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.phone}">Phone number</label>
                        <input th:field="*{phone}" type="text" placeholder="+XXXXXXXXXXXX" maxlength="13" required>
                        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4 class="section-title" th:text="#{admin.userRegistration.section.address}">Address</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.country}">Country</label>
                        <input th:field="*{country}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.city}">City</label>
                        <input th:field="*{city}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.region}">Region</label>
                        <input th:field="*{region}" type="text">
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.street}">Street</label>
                        <input th:field="*{street}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.houseNumber}">House number</label>
                        <input th:field="*{houseNumber}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('houseNumber')}" th:errors="*{houseNumber}"></span>
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.apartment}">Apartment</label>
                        <input th:field="*{apartment}" type="text">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userRegistration.postalCode}">Postal code</label>
                        <input th:field="*{postalCode}" type="text" required>
                        <span class="field-error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></span>
                    </div>
                    <div class="form-group"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save" th:text="#{admin.userRegistration.btn.save}">Register User</button>
                <button type="reset" class="btn-reset" th:text="#{admin.userRegistration.btn.reset}">Reset</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
