<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.billing-setup.title}">Billing Setup - Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/billing-setup.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="lang-picker">
    <form action="" method="get">
        <div class="select-wrapper">
            <select name="lang" onchange="this.form.submit()" th:aria-label="#{admin.billing-setup.language.label}">
                <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{admin.billing-setup.language.en}"></option>
                <option value="fr" th:selected="${#locale.language == 'fr'}" th:text="#{admin.billing-setup.language.fr}"></option>
                <option value="de" th:selected="${#locale.language == 'de'}" th:text="#{admin.billing-setup.language.de}"></option>
                <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{admin.billing-setup.language.ru}"></option>
                <option value="uk" th:selected="${#locale.language == 'uk'}" th:text="#{admin.billing-setup.language.ukr}"></option>
            </select>
            <div class="select-arrow">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>
    </form>
</div>

<div class="setup-container">
    <div class="setup-card">

        <div class="setup-header">
            <p class="eyebrow" th:text="#{admin.billing-setup.eyebrow}">Initial Configuration</p>
            <h1 th:text="#{admin.billing-setup.title}">Billing Setup</h1>
            <p class="page-subtitle" th:text="#{admin.billing-setup.subtitle}">Configure your multi-currency environment before launching.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger slide-down">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/admin/billing-setup}" th:object="${billingSetupDto}" method="post" class="setup-form">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="baseCurrency" class="form-label" th:text="#{admin.billing-setup.baseCurrency.label}">Base Currency</label>
                <input type="text" id="baseCurrency" th:field="*{baseCurrency}" class="form-control"
                       th:placeholder="#{admin.billing-setup.baseCurrency.placeholder}" th:errorclass="is-invalid">

                <div class="field-error slide-down" th:if="${#fields.hasErrors('baseCurrency')}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span th:text="#{admin.billing-setup.baseCurrency.error}"></span>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <span th:text="#{admin.billing-setup.submit}">Complete Setup</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
