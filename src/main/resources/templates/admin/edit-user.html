<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.userEdit.title}">Edit User Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user-edit.css}">
</head>
<body>

<div th:replace="~{admin/sidebar :: aside}"></div>

<div class="main-content">

    <div class="page-header">
        <p class="eyebrow" th:text="#{admin.userEdit.management}">User Management</p>
        <h1 th:text="#{admin.userEdit.heading}">Edit User Profile</h1>
        <p class="page-subtitle">
            <span th:text="#{admin.userEdit.subtitle}">Modify account details for</span> <span class="highlight" th:text="${user.email}"></span>
        </p>
    </div>

    <div class="reg-form-container">
        <form th:action="@{/admin/users/profile/update/{id}(id=${userId})}" th:object="${user}" method="post">

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-section">
                <h4 class="section-title" th:text="#{admin.userEdit.section.personal}">Personal details</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.firstName}">First name</label>
                        <input type="text" th:field="*{firstName}">
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.lastName}">Last name</label>
                        <input type="text" th:field="*{lastName}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.email}">Email address</label>
                        <input type="email" th:field="*{email}">
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.phone}">Phone number</label>
                        <input type="text" th:field="*{phone}" placeholder="+XXXXXXXXXXXX" maxlength="13">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h4 class="section-title" th:text="#{admin.userEdit.section.address}">Address</h4>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.country}">Country</label>
                        <input type="text" th:field="*{country}">
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.city}">City</label>
                        <input type="text" th:field="*{city}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.region}">Region</label>
                        <input type="text" th:field="*{region}">
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.street}">Street</label>
                        <input type="text" th:field="*{street}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.houseNumber}">House number</label>
                        <input type="text" th:field="*{houseNumber}">
                    </div>
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.apartment}">Apartment</label>
                        <input type="text" th:field="*{apartment}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{admin.userEdit.postalCode}">Postal code</label>
                        <input type="text" th:field="*{postalCode}">
                    </div>
                    <div class="form-group"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save" th:text="#{admin.userEdit.btn.save}">Save changes</button>
                <a th:href="@{/admin/users/profile/{id}(id=${userId})}" class="btn-reset" th:text="#{admin.userEdit.btn.cancel}">Cancel</a>
            </div>
        </form>
    </div>

</div>

</body>
</html>
