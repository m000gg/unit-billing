<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <div th:if="${param.error}" class="error">
        Invalid email or password
    </div>


    <form th:action="@{/login/process}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Sign In</button>
    </form>

    <p style="text-align: center; font-size: 12px; margin-top: 15px;">
        <a href="/forgotpass" style="color: #888;">Forgot password?</a>
    </p>
</div>

</body>
</html>
