<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/client/index.css}">
    <link rel="stylesheet" th:href="@{/css/client/profile.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" href="/client/">
            <span class="brand__mark">UB</span>
            <span class="brand__name">Unit billing</span>
        </a>

        <nav class="topnav">
            <a class="topnav__link" href="/client/">Home</a>
            <a class="topnav__link" href="#">Invoices</a>
            <a class="topnav__link" href="#">Payment method</a>
            <a class="topnav__link topnav__link--active" href="/client/profile">Profile</a>
        </nav>

        <div class="topbar__account">
            <a class="profile-btn" href="/client/profile">
                <span class="profile-btn__avatar" th:text="${#strings.isEmpty(userViewModel.firstName) ? '—' : #strings.substring(userViewModel.firstName, 0, 1)}">V</span>
                <span class="profile-btn__text">
                    <span class="profile-btn__name" th:text="|${userProfileViewModel.firstName} ${userProfileViewModel.lastName}|"></span>
                    <span class="profile-btn__id" th:text="${userProfileViewModel.email}"></span>
                </span>
            </a>
            <form method="post" action="/logout">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-logout">Log out</button>
            </form>
        </div>
    </div>
</header>

<main class="page">

    <section class="statement">
        <div class="statement__intro">
            <p class="statement__eyebrow">Account settings</p>
            <h1 class="statement__title">Your profile</h1>
            <p class="statement__sub">Manage your personal information and account details.</p>
        </div>
    </section>

    <section class="profile-section">
        <h2 class="profile-section__title">Personal information</h2>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">First name</label>
                <p class="info-value" th:text="${userProfileViewModel.firstName}">John</p>
            </div>
            <div class="info-field">
                <label class="info-label">Last name</label>
                <p class="info-value" th:text="${userProfileViewModel.lastName}">Doe</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">Email</label>
                <p class="info-value" th:text="${userProfileViewModel.email}">john@example.com</p>
            </div>
            <div class="info-field">
                <label class="info-label">Phone</label>
                <p class="info-value" th:text="${userProfileViewModel.phone != null ? userProfileViewModel.phone : '—'}">—</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">Account created</label>
                <p class="info-value" th:text="${#dates.format(userProfileViewModel.createdAt, 'MMM d, yyyy')}">Aug 1, 2026</p>
            </div>
        </div>
    </section>

    <section class="profile-section">
        <h2 class="profile-section__title">Address</h2>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">Country</label>
                <p class="info-value" th:text="${userProfileViewModel.country != null ? userProfileViewModel.country : '—'}">—</p>
            </div>
            <div class="info-field">
                <label class="info-label">Region</label>
                <p class="info-value" th:text="${userProfileViewModel.region != null ? userProfileViewModel.region : '—'}">—</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">City</label>
                <p class="info-value" th:text="${userProfileViewModel.city != null ? userProfileViewModel.city : '—'}">—</p>
            </div>
            <div class="info-field">
                <label class="info-label">Postal code</label>
                <p class="info-value" th:text="${userProfileViewModel.postalCode != null ? userProfileViewModel.postalCode : '—'}">—</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">Street</label>
                <p class="info-value" th:text="${userProfileViewModel.street != null ? userProfileViewModel.street : '—'}">—</p>
            </div>
            <div class="info-field">
                <label class="info-label">House number</label>
                <p class="info-value" th:text="${userProfileViewModel.houseNumber != null ? userProfileViewModel.houseNumber : '—'}">—</p>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">Apartment</label>
                <p class="info-value" th:text="${userProfileViewModel.apartment != null ? userProfileViewModel.apartment : '—'}">—</p>
            </div>
        </div>
    </section>

    <section class="profile-section">
        <h2 class="profile-section__title">Account information</h2>

        <div class="info-grid">
            <div class="info-field">
                <label class="info-label">Current balance</label>
                <p class="info-value balance-value" th:text="${'$' + #numbers.formatDecimal(userProfileViewModel.balance, 1, 2)}">$0.00</p>
            </div>
        </div>
    </section>


</main>

</body>
</html>
