privacy.title=Privacy Policy
privacy.lastUpdated=Last Updated: September 2026
privacy.intro.title=1. Introduction
privacy.intro.text=Welcome to Unit Billing. We respect your privacy and are committed to protecting your personal data. This privacy policy will inform you as to how we look after your personal data when you visit our website.
privacy.controller.title=2. Data Controller
privacy.controller.text=For the purposes of the General Data Protection Regulation (GDPR), the data controller is:
privacy.data.title=3. Data We Collect
privacy.data.text=We may collect, use, store and transfer different kinds of personal data about you which we have grouped together as follows:
privacy.data.li1=<strong>Identity Data:</strong> includes first name, last name, username or similar identifier.
privacy.data.li2=<strong>Contact Data:</strong> includes billing address, delivery address, email address and telephone numbers.
privacy.data.li3=<strong>Technical Data:</strong> includes internet protocol (IP) address, your login data, browser type and version, time zone setting and location.
privacy.usage.title=4. How We Use Your Data
privacy.usage.text=We will only use your personal data when the law allows us to. Most commonly, we will use your personal data in the following circumstances:
privacy.usage.li1=Where we need to perform the contract we are about to enter into or have entered into with you (e.g., providing billing services).
privacy.usage.li2=Where it is necessary for our legitimate interests (or those of a third party) and your interests and fundamental rights do not override those interests.
privacy.usage.li3=Where we need to comply with a legal obligation.
privacy.rights.title=5. Your Legal Rights
privacy.rights.text1=Under certain circumstances, you have rights under data protection laws in relation to your personal data, including the right to:
privacy.rights.li1=Request access to your personal data.
privacy.rights.li2=Request correction of your personal data.
privacy.rights.li3=Request erasure of your personal data.
privacy.rights.text2=If you wish to exercise any of the rights set out above, please contact us at the email address provided in Section 2.
impressum.title=Legal Notice / Impressum
impressum.info.title=Information pursuant to \u00A7 5 DDG
impressum.contact.title=Contact
impressum.liability.content.title=Liability for Content
impressum.liability.content.text=As a service provider, we are responsible for our own content on these pages in accordance with general legislation pursuant to \u00A7 7 section 1 of the DDG. However, we are not obligated to monitor transmitted or stored third-party information.
impressum.liability.links.title=Liability for Links
impressum.liability.links.text=Our offer contains links to external third-party websites, over whose content we have no influence. Therefore, we cannot assume any liability for this external content.
impressum.copyright.title=Copyright
impressum.copyright.text=The content and works created by the site operators on these pages are subject to German copyright law. The duplication, processing, distribution, and any kind of exploitation require written consent.