impressum.liability.links.text=\u041D\u0430\u0448 \u0441\u0430\u0439\u0442 \u0441\u043E\u0434\u0435\u0440\u0436\u0438\u0442 \u0441\u0441\u044B\u043B\u043A\u0438 \u043D\u0430 \u0432\u043D\u0435\u0448\u043D\u0438\u0435 \u0441\u0430\u0439\u0442\u044B \u0442\u0440\u0435\u0442\u044C\u0438\u0445 \u043B\u0438\u0446, \u043D\u0430 \u0441\u043E\u0434\u0435\u0440\u0436\u0430\u043D\u0438\u0435 \u043A\u043E\u0442\u043E\u0440\u044B\u0445 \u043C\u044B \u043D\u0435 \u0438\u043C\u0435\u0435\u043C \u0432\u043B\u0438\u044F\u043D\u0438\u044F. \u041F\u043E\u044D\u0442\u043E\u043C\u0443 \u043C\u044B \u043D\u0435 \u043C\u043E\u0436\u0435\u043C \u0431\u0440\u0430\u0442\u044C \u043D\u0430 \u0441\u0435\u0431\u044F \u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0441\u0442\u044C \u0437\u0430 \u044D\u0442\u043E\u0442 \u0441\u0442\u043E\u0440\u043E\u043D\u043D\u0438\u0439 \u043A\u043E\u043D\u0442\u0435\u043D\u0442.
