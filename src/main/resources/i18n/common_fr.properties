privacy.title=Politique de confidentialit\u00E9
privacy.lastUpdated=Derni\u00E8re mise \u00E0 jour : Septembre 2026
privacy.intro.title=1. Introduction
privacy.intro.text=Bienvenue sur Unit Billing. Nous respectons votre vie priv\u00E9e et nous nous engageons \u00E0 prot\u00E9ger vos donn\u00E9es personnelles. Cette politique explique comment nous traitons vos donn\u00E9es lors de l'utilisation de nos services.
privacy.controller.title=2. Responsable du traitement
privacy.controller.text=Aux fins du R\u00E8glement G\u00E9n\u00E9ral sur la Protection des Donn\u00E9es (RGPD), le responsable du traitement est :
privacy.data.title=3. Donn\u00E9es que nous collectons
privacy.data.text=Nous pouvons collecter, utiliser, stocker et transf\u00E9rer diff\u00E9rents types de donn\u00E9es personnelles vous concernant, que nous avons regroup\u00E9es comme suit :
privacy.data.li1=<strong>Donn\u00E9es d'identit\u00E9 :</strong> comprend le pr\u00E9nom, le nom de famille, le nom d'utilisateur ou un identifiant similaire.
privacy.data.li2=<strong>Donn\u00E9es de contact :</strong> comprend l'adresse de facturation, l'adresse e-mail et les num\u00E9ros de t\u00E9l\u00E9phone.
privacy.data.li3=<strong>Donn\u00E9es techniques :</strong> comprend l'adresse IP, vos donn\u00E9es de connexion, le type et la version du navigateur, le fuseau horaire et l'emplacement.
privacy.usage.title=4. Comment nous utilisons vos donn\u00E9es
privacy.usage.text=Nous n'utiliserons vos donn\u00E9es personnelles que lorsque la loi nous y autorise. Le plus souvent, nous utiliserons vos donn\u00E9es dans les circonstances suivantes :
privacy.usage.li1=Lorsque nous devons ex\u00E9cuter le contrat que nous sommes sur le point de conclure ou que nous avons conclu avec vous (ex. fourniture de services de facturation).
privacy.usage.li2=Lorsque cela est n\u00E9cessaire pour nos int\u00E9r\u00EAts l\u00E9gitimes et que vos int\u00E9r\u00EAts et droits fondamentaux ne pr\u00E9valent pas sur ces int\u00E9r\u00EAts.
privacy.usage.li3=Lorsque nous devons nous conformer \u00E0 une obligation l\u00E9gale.
privacy.rights.title=5. Vos droits l\u00E9gaux
privacy.rights.text1=Dans certaines circonstances, vous avez des droits en vertu des lois sur la protection des donn\u00E9es en ce qui concerne vos donn\u00E9es personnelles, y compris le droit de :
privacy.rights.li1=Demander l'acc\u00E8s \u00E0 vos donn\u00E9es personnelles.
privacy.rights.li2=Demander la correction de vos donn\u00E9es personnelles.
privacy.rights.li3=Demander l'effacement de vos donn\u00E9es personnelles.
privacy.rights.text2=Si vous souhaitez exercer l'un des droits \u00E9nonc\u00E9s ci-dessus, veuillez nous contacter \u00E0 l'adresse e-mail indiqu\u00E9e dans la section 2.
impressum.title=Mentions l\u00E9gales (Impressum)
impressum.info.title=Informations conform\u00E9ment au \u00A7 5 DDG
impressum.contact.title=Contact
impressum.liability.content.title=Responsabilit\u00E9 pour le contenu
impressum.liability.content.text=En tant que prestataire de services, nous sommes responsables de nos propres contenus sur ces pages conform\u00E9ment au \u00A7 7 al. 1 de la loi DDG. Cependant, nous ne sommes pas tenus de surveiller les informations tierces transmises ou stock\u00E9es.
impressum.liability.links.title=Responsabilit\u00E9 pour les liens
impressum.liability.links.text=Notre site contient des liens vers des sites Web tiers externes, sur le contenu desquels nous n'avons aucune influence. Par cons\u00E9quent, nous ne pouvons assumer aucune responsabilit\u00E9 pour ce contenu externe.
impressum.copyright.title=Droit d'auteur
impressum.copyright.text=Le contenu et les \u0153uvres cr\u00E9\u00E9s par les op\u00E9rateurs du site sur ces pages sont soumis au droit d'auteur allemand. La reproduction, le traitement, la distribution et toute forme d'exploitation n\u00E9cessitent un consentement \u00E9crit.