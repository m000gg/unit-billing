impressum.copyright.text=\u041C\u0430\u0442\u0435\u0440\u0456\u0430\u043B\u0438 \u0442\u0430 \u0440\u043E\u0431\u043E\u0442\u0438, \u0440\u043E\u0437\u043C\u0456\u0449\u0435\u043D\u0456 \u043D\u0430 \u0446\u044C\u043E\u043C\u0443 \u0432\u0435\u0431-\u0441\u0430\u0439\u0442\u0456, \u0437\u0430\u0445\u0438\u0449\u0435\u043D\u0456 \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0432\u0441\u0442\u0432\u043E\u043C \u043F\u0440\u043E \u0430\u0432\u0442\u043E\u0440\u0441\u044C\u043A\u0435 \u043F\u0440\u0430\u0432\u043E. \u0411\u0443\u0434\u044C-\u044F\u043A\u0435 \u043A\u043E\u043F\u0456\u044E\u0432\u0430\u043D\u043D\u044F, \u0437\u043C\u0456\u043D\u0430, \u043F\u043E\u0448\u0438\u0440\u0435\u043D\u043D\u044F \u0442\u0430 \u0432\u0438\u043A\u043E\u0440\u0438\u0441\u0442\u0430\u043D\u043D\u044F \u0437\u0430 \u043C\u0435\u0436\u0430\u043C\u0438, \u0434\u043E\u0437\u0432\u043E\u043B\u0435\u043D\u0438\u043C\u0438 \u0437\u0430\u043A\u043E\u043D\u043E\u043C \u043F\u0440\u043E \u0430\u0432\u0442\u043E\u0440\u0441\u044C\u043A\u0435 \u043F\u0440\u0430\u0432\u043E, \u043F\u043E\u0442\u0440\u0435\u0431\u0443\u044E\u0442\u044C \u043F\u043E\u043F\u0435\u0440\u0435\u0434\u043D\u044C\u043E\u0457 \u043F\u0438\u0441\u044C\u043C\u043E\u0432\u043E\u0457 \u0437\u0433\u043E\u0434\u0438 \u0432\u0456\u0434\u043F\u043E\u0432\u0456\u0434\u043D\u043E\u0433\u043E \u0430\u0432\u0442\u043E\u0440\u0430 \u0430\u0431\u043E \u043F\u0440\u0430\u0432\u043E\u0432\u043B\u0430\u0441\u043D\u0438\u043A\u0430.