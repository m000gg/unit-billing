server.port=8081
spring.application.name=client-backend

spring.thymeleaf.prefix=file:apps/client/frontend/templates/
spring.web.resources.static-locations=file:apps/client/frontend/static/
spring.thymeleaf.suffix=.html

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/unit-billing



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.data-locations=file:database/seed/data.sql