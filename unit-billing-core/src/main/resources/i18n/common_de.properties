privacy.title=Datenschutzerkl\u00E4rung
privacy.lastUpdated=Zuletzt aktualisiert: September 2026
privacy.intro.title=1. Einleitung
privacy.intro.text=Willkommen bei Unit Billing. Wir respektieren Ihre Privatsph\u00E4re und verpflichten uns zum Schutz Ihrer personenbezogenen Daten. Diese Datenschutzerkl\u00E4rung informiert Sie dar\u00FCber, wie wir mit Ihren Daten umgehen, wenn Sie unsere Website besuchen.
privacy.controller.title=2. Verantwortlicher
privacy.controller.text=Verantwortlicher im Sinne der Datenschutz-Grundverordnung (DSGVO) ist:
privacy.data.title=3. Welche Daten wir erheben
privacy.data.text=Wir k\u00F6nnen verschiedene Arten von personenbezogenen Daten \u00FCber Sie erheben, verwenden, speichern und \u00FCbertragen, die wir wie folgt zusammengefasst haben:
privacy.data.li1=<strong>Identit\u00E4tsdaten:</strong> umfassen Vorname, Nachname, Benutzername oder \u00E4hnliche Identifikatoren.
privacy.data.li2=<strong>Kontaktdaten:</strong> umfassen Rechnungsadresse, E-Mail-Adresse und Telefonnummern.
privacy.data.li3=<strong>Technische Daten:</strong> umfassen IP-Adresse, Ihre Log-in-Daten, Browsertyp und -version, Zeitzoneneinstellung und Standort.
privacy.usage.title=4. Wie wir Ihre Daten verwenden
privacy.usage.text=Wir verwenden Ihre personenbezogenen Daten nur, wenn das Gesetz es uns erlaubt. Meistens verwenden wir Ihre Daten in den folgenden F\u00E4llen:
privacy.usage.li1=Wenn wir den Vertrag erf\u00FCllen m\u00FCssen, den wir mit Ihnen abschlie\u00DFen oder abgeschlossen haben (z. B. Bereitstellung von Abrechnungsdiensten).
privacy.usage.li2=Wenn es f\u00FCr unsere berechtigten Interessen erforderlich ist und Ihre Interessen und Grundrechte diese Interessen nicht \u00FCberwiegen.
privacy.usage.li3=Wenn wir einer gesetzlichen Verpflichtung nachkommen m\u00FCssen.
privacy.rights.title=5. Ihre gesetzlichen Rechte
privacy.rights.text1=Unter bestimmten Umst\u00E4nden haben Sie nach den Datenschutzgesetzen Rechte in Bezug auf Ihre personenbezogenen Daten, einschlie\u00DFlich des Rechts auf:
privacy.rights.li1=Auskunft \u00FCber Ihre personenbezogenen Daten.
privacy.rights.li2=Berichtigung Ihrer personenbezogenen Daten.
privacy.rights.li3=L\u00F6schung Ihrer personenbezogenen Daten.
privacy.rights.text2=Wenn Sie eines der oben genannten Rechte aus\u00FCben m\u00F6chten, kontaktieren Sie uns bitte unter der in Abschnitt 2 angegebenen E-Mail-Adresse.
