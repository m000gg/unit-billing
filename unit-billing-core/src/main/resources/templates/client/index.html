<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{client.index.title}">Main Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/client/index.css}">
    <th:block th:if="${dashboardSections != null}"
              th:each="section : ${dashboardSections}">

        <link th:each="stylesheet : ${section.stylesheets}"
              rel="stylesheet"
              th:href="${stylesheet}">

    </th:block>
</head>
<body>

<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" href="/client/">
            <span class="brand__mark">UB</span>
            <span class="brand__name" th:text="#{client.index.brand}">Unit billing</span>
        </a>

        <nav class="topnav">

            <a class="topnav__link" th:classappend="${currentUri == '/client/'} ? 'topnav__link--active' : ''" href="/client/" th:text="#{client.index.nav.home}">Home</a>

            <th:block th:if="${not #lists.isEmpty(activePlugins)}">
                <a th:each="pluginId : ${activePlugins}"
                   class="topnav__link"
                   th:classappend="${currentUri != null and currentUri.startsWith('/client/plugins/' + pluginId)} ? 'topnav__link--active' : ''"
                   th:href="@{${pluginBaseUrl} + ${pluginId}}"
                   th:text="${#strings.capitalizeWords(#strings.replace(pluginId, '-', ' '))}">
                    Plugin Name
                </a>
            </th:block>
        </nav>

        <div class="topbar__account">

            <div class="lang-switcher">
                <button class="lang-switcher__btn" type="button" th:aria-label="#{client.langSwitcher.ariaLabel}">
                    <svg class="lang-switcher__icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span class="lang-switcher__current" th:text="${#locale.language == 'uk' ? 'UKR' : #strings.toUpperCase(#locale.language)}">EN</span>
                    <svg class="lang-switcher__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <div class="lang-switcher__menu">
                    <a href="?lang=en" class="lang-switcher__item">
                        <span class="lang-switcher__name">English</span>
                        <span class="lang-switcher__code">EN</span>
                    </a>
                    <a href="?lang=de" class="lang-switcher__item">
                        <span class="lang-switcher__name">Deutsch</span>
                        <span class="lang-switcher__code">DE</span>
                    </a>
                    <a href="?lang=fr" class="lang-switcher__item">
                        <span class="lang-switcher__name">Français</span>
                        <span class="lang-switcher__code">FR</span>
                    </a>
                    <a href="?lang=uk" class="lang-switcher__item">
                        <span class="lang-switcher__name">Українська</span>
                        <span class="lang-switcher__code">UKR</span>
                    </a>
                    <a href="?lang=ru" class="lang-switcher__item">
                        <span class="lang-switcher__name">Русский</span>
                        <span class="lang-switcher__code">RU</span>
                    </a>
                </div>
            </div>

            <a class="profile-btn" href="/client/profile">
                <span class="profile-btn__avatar" th:text="${#strings.isEmpty(userViewModel.firstName) ? '—' : #strings.substring(userViewModel.firstName, 0, 1)}">V</span>
                <span class="profile-btn__text">
                    <span class="profile-btn__name" th:text="|${userViewModel.firstName} ${userViewModel.lastName}|"></span>
                    <span class="profile-btn__id" th:text="${userViewModel.email}"></span>
                </span>
            </a>
            <form method="post" action="/logout">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-logout" th:text="#{client.index.logout}">Log out</button>
            </form>
        </div>
    </div>
</header>

<main class="page">

    <section class="statement">
        <div class="statement__intro">
            <p class="statement__eyebrow"
               th:text="#{client.index.eyebrow}">
                Account overview
            </p>

            <h1 class="statement__title"
                th:text="#{client.index.welcome(${userViewModel.firstName})}">
                Welcome back, User
            </h1>
        </div>

        <div class="statement__figures">
            <div class="figure">
                <span class="figure__label"
                      th:text="#{client.index.currentBalance}">
                    Current balance
                </span>

                <span class="figure__value"
                      th:text="${userViewModel.userCurrency + ' ' + #numbers.formatDecimal(userViewModel.balance, 1, 2)}">
                    USD 128.40
                </span>
            </div>
        </div>
    </section>

    <section class="plugin-dashboard"
             th:if="${dashboardSections != null and !#lists.isEmpty(dashboardSections)}">

        <th:block th:each="section : ${dashboardSections}">
            <section class="plugin-dashboard__section"
                     th:attr="data-plugin-id=${section.pluginId},
                              data-section-id=${section.id}">

                <h2 class="plugin-dashboard__title"
                    th:text="${section.title}">
                </h2>

                <div class="plugin-dashboard__content"
                     th:utext="${section.content}">
                </div>

            </section>
        </th:block>
    </section>

    <section class="ledger">
        <div class="ledger__header">
            <h2 class="ledger__title"
                th:text="#{client.index.ledger.title}">
                Recent activity
            </h2>

            <a class="ledger__link"
               href="/client/profile"
               th:text="#{client.index.ledger.viewAll}">
                View all
            </a>
        </div>

        <ul class="ledger__list"
            th:if="${!#lists.isEmpty(ledgerEntryUserViewModelList)}">

            <li class="ledger-row"
                th:each="entry : ${ledgerEntryUserViewModelList}">

                <span class="ledger-row__desc">
                    <span th:text="${entry.description != null ? entry.description : '—'}">
                        Transaction
                    </span>

                    <span class="ledger-row__type-badge"
                          th:classappend="${'ledger-row__type-badge--' + #strings.toLowerCase(entry.type.name())}"
                          th:text="#{__${'admin.ledger.type.' + entry.type.name()}__}">
                        CHARGE
                    </span>
                </span>

                <span class="ledger-row__date"
                      th:text="${#temporals.format(entry.createdAt, 'MMM d, yyyy')}">
                    Date
                </span>

                <span class="ledger-row__amount"
                      th:classappend="${entry.type.name() != 'CHARGE' and entry.type.name() != 'CORRECTION_DECREASE' ? ' ledger-row__amount--credit' : ''}"
                      th:text="${((entry.type.name() == 'CHARGE' or entry.type.name() == 'CORRECTION_DECREASE') ? '-' : '+') + entry.userCurrency + ' ' + #numbers.formatDecimal(entry.amount.abs(), 1, 2)}">
                    USD 0.00
                </span>
            </li>
        </ul>

        <div class="ledger__empty"
             th:if="${#lists.isEmpty(ledgerEntryUserViewModelList)}"
             th:text="#{client.index.ledger.empty}">
            No transactions yet.
        </div>
    </section>

</main>

<footer class="site-footer">
    <div class="site-footer__inner">
        <a th:href="@{/impressum}" th:text="#{login.impressum}">Impressum</a>
        <span class="site-footer__separator">&middot;</span>
        <a th:href="@{/privacy}" th:text="#{login.privacy}">Privacy Policy</a>
    </div>
</footer>

<th:block th:if="${dashboardSections != null}"
          th:each="section : ${dashboardSections}">

    <script th:each="script : ${section.scripts}"
            th:src="${script}"
            defer>
    </script>

</th:block>

</body>
</html>
